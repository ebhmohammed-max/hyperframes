<title>Before the Dragons — The Rise of Old Valyria</title>

<style>
/* Rise of Old Valyria — cinematic cut. Shared look for every scene file.
   Ground: cold basalt black. Ink: aged parchment. Accent: ember.
   Two materials only: photographic plates, and the archive board (paper on dark). */

:root {
  --ground: #07070a;
  --ground-soft: #0d0d11;
  --ink: #f2ead9;
  --ink-dim: #cdc3ae;
  --muted: #8d8778;
  --ember: #d78a3c;
  --ember-hot: #f0b063;
  --paper: #e8dcc2;
  --paper-ink: #23201a;
  --paper-ink-dim: #5a5245;
  --hair: rgba(232, 220, 194, 0.24);
  --display: "Playfair Display", Georgia, "Times New Roman", serif;
  --serif: Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", "Space Mono", Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: var(--ground);
}

.stage {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: var(--ground);
}

/* ---------- photographic plate ---------- */
.plate { position: absolute; inset: 0; overflow: hidden; background: #000; }
.plate img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform-origin: 50% 50%;
  will-change: transform;
}
.grade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%),
    linear-gradient(180deg, rgba(4,4,6,0.55) 0%, rgba(4,4,6,0) 22%, rgba(4,4,6,0) 62%, rgba(4,4,6,0.72) 100%);
}
.grain {
  position: absolute;
  inset: -40px;
  pointer-events: none;
  opacity: 0.16;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.55'/></svg>");
}

/* ---------- on-screen text over plates ---------- */
.slate {
  position: absolute;
  left: 132px;
  bottom: 118px;
  max-width: 1360px;
  z-index: 6;
  padding: 30px 40px 34px 40px;
  background: linear-gradient(100deg, rgba(6,6,8,0.86) 0%, rgba(6,6,8,0.72) 62%, rgba(6,6,8,0) 100%);
  border-left: 3px solid var(--ember);
}
.kicker {
  display: block;
  font-family: var(--mono);
  font-size: 28px;
  letter-spacing: 0.30em;
  text-transform: uppercase;
  color: var(--ember-hot);
  margin-bottom: 16px;
}
.headline {
  font-family: var(--display);
  font-weight: 400;
  font-size: 68px;
  line-height: 1.12;
  letter-spacing: 0.005em;
  color: var(--ink);
  margin: 0;
  text-wrap: balance;
}
.headline em { font-style: italic; color: var(--ember-hot); }

/* ---------- intertitle: full-bleed type card on black ---------- */
.intertitle { position: absolute; inset: 0; background: var(--ground); display: grid; place-items: center; }
.intertitle .inner { text-align: center; max-width: 1420px; }
.intertitle .eyebrow {
  font-family: var(--mono);
  font-size: 30px;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--ember);
  margin-bottom: 26px;
}
.intertitle h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: 104px;
  line-height: 1.06;
  margin: 0;
  color: var(--ink);
  letter-spacing: 0.004em;
}
.intertitle .sub {
  font-family: var(--serif);
  font-style: italic;
  font-size: 34px;
  color: var(--ink-dim);
  margin-top: 30px;
}
.rule { height: 1px; background: var(--hair); width: 340px; margin: 34px auto 0; transform-origin: 50% 50%; }

/* ---------- chapter card ---------- */
.chapter { position: absolute; inset: 0; background: var(--ground); display: grid; grid-template-columns: 1fr 1fr; }
.chapter .left { position: relative; display: grid; place-items: center; }
.chapter .num {
  font-family: var(--display);
  font-size: 380px;
  line-height: 0.8;
  color: transparent;
  -webkit-text-stroke: 2px rgba(232, 220, 194, 0.34);
}
.chapter .right { padding: 0 150px 0 20px; display: flex; flex-direction: column; justify-content: center; }
.chapter .label {
  font-family: var(--mono);
  font-size: 30px;
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: var(--ember);
  margin-bottom: 24px;
}
.chapter h2 { font-family: var(--display); font-weight: 400; font-size: 82px; line-height: 1.1; margin: 0 0 26px; color: var(--ink); }
.chapter p { font-family: var(--serif); font-size: 30px; line-height: 1.5; color: var(--ink-dim); margin: 0; max-width: 700px; }
.chapter .vline { position: absolute; left: 50%; top: 14%; bottom: 14%; width: 1px; background: var(--hair); }

/* =====================================================
   ARCHIVE BOARD — the explanation device
   A dark desk. Paper artifacts pinned flat, lit from above.
   ===================================================== */
.board { position: absolute; inset: 0; background:
  radial-gradient(90% 70% at 50% 6%, #1a1a20 0%, #0b0b0f 58%, #07070a 100%);
  overflow: hidden; }
.board .desklight {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(46% 42% at 50% 30%, rgba(255,236,200,0.10) 0%, rgba(255,236,200,0) 70%);
}
.board .caption {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 132px 30px;
  font-family: var(--mono); font-size: 29px; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(232,220,194,0.62);
  background: linear-gradient(180deg, rgba(7,7,10,0) 0%, rgba(7,7,10,0.92) 60%);
  z-index: 40;
}
.board .caption b { color: var(--ember-hot); font-weight: 500; }

/* paper artifact */
.paper {
  position: absolute;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 26%),
    radial-gradient(120% 120% at 12% 8%, #f0e6cf 0%, #e4d7bb 52%, #d8c9aa 100%);
  color: var(--paper-ink);
  box-shadow:
    0 26px 48px rgba(0,0,0,0.62),
    0 4px 10px rgba(0,0,0,0.45),
    inset 0 0 60px rgba(120,98,64,0.14);
  overflow: hidden;
  transform-origin: 50% 6%;
}
.paper::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23p)' opacity='0.22'/></svg>");
  opacity: 0.5;
  mix-blend-mode: multiply;
}
.paper .stamp {
  position: absolute; right: 30px; bottom: 22px;
  font-family: var(--mono); font-size: 28px; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(143, 46, 34, 0.72);
  border: 2px solid rgba(143, 46, 34, 0.5);
  padding: 8px 12px;
  transform: rotate(-6deg);
  opacity: 0.85;
}
.paper h3 {
  font-family: var(--serif); font-weight: 700; font-size: 44px; line-height: 1.14;
  margin: 0 0 14px; letter-spacing: -0.01em;
}
.paper .meta {
  font-family: var(--mono); font-size: 28px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--paper-ink-dim); margin-bottom: 18px; line-height: 1.3;
}
.paper p { font-family: var(--serif); font-size: 29px; line-height: 1.4; margin: 0 0 10px; color: #2b271f; }
.paper .note-hand {
  font-family: var(--serif); font-style: italic; font-size: 32px; color: #3f4568; transform: rotate(-1.2deg);
}
.paper .tag {
  display: inline-block; font-family: var(--mono); font-size: 28px; letter-spacing: 0.10em;
  text-transform: uppercase; color: #4a4335; border: 1px solid rgba(74,67,53,0.42);
  padding: 6px 10px; margin: 0 8px 8px 0; background: rgba(255,255,255,0.16);
}

/* photo print */
.print {
  position: absolute;
  display: flex;
  flex-direction: column;
  padding: 14px 14px 8px;
  background: linear-gradient(180deg, #f4ecdb 0%, #e6dcc6 100%);
  box-shadow: 0 26px 48px rgba(0,0,0,0.66), 0 4px 10px rgba(0,0,0,0.45);
  transform-origin: 50% 6%;
}
.print img { display: block; width: 100%; flex: 1 1 auto; min-height: 0; object-fit: cover; filter: saturate(0.66) contrast(1.06) sepia(0.16) brightness(0.94); }
.print .plabel {
  flex: 0 0 auto; padding: 10px 4px 6px; min-height: 54px;
  font-family: var(--mono); font-size: 27px; letter-spacing: 0.06em; text-transform: uppercase;
  color: #5f5648; display: flex; justify-content: space-between; gap: 10px; align-items: center;
}

/* pin, tape, string */
.pin { position: absolute; width: 26px; height: 26px; border-radius: 50%; z-index: 30;
  background: radial-gradient(circle at 34% 30%, #ffd9a8 0%, #c9762f 42%, #7d3d13 100%);
  box-shadow: 0 2px 2px rgba(0,0,0,0.6), 0 12px 16px rgba(0,0,0,0.5); }
.tape { position: absolute; width: 132px; height: 40px; z-index: 31;
  background: linear-gradient(180deg, rgba(238,228,205,0.62), rgba(226,214,188,0.46));
  box-shadow: 0 3px 8px rgba(0,0,0,0.34);
  clip-path: polygon(2% 0, 98% 4%, 100% 92%, 6% 100%, 0 62%); }
.string { position: absolute; inset: 0; z-index: 28; pointer-events: none; }

/* board headings */
.board-title {
  position: absolute; left: 132px; top: 92px; z-index: 35;
}
.board-title .eyebrow {
  font-family: var(--mono); font-size: 30px; letter-spacing: 0.34em; text-transform: uppercase;
  color: var(--ember);
}
.board-title h2 {
  font-family: var(--display); font-weight: 400; font-size: 66px; line-height: 1.1;
  margin: 14px 0 0; color: var(--ink);
}
.board-title .lead {
  font-family: var(--serif); font-size: 30px; line-height: 1.45; color: var(--ink-dim);
  margin: 18px 0 0; max-width: 760px;
}

  #film { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07070a; }
  #film > .clip:not(audio) { position: absolute; inset: 0; }
</style>
